name: update-data

# 更新控制(Update control)
#   手動更新:GitHub → Actions → update-data → Run workflow(可選 all / database / news)
#            或指令:gh workflow run update-data -f pipeline=database
#   自動更新開關:repo 變數 AUTO_UPDATE。未設定或不是 "on" = 關閉(預設關閉)。
#            開啟:gh variable set AUTO_UPDATE --body on
#            關閉:gh variable set AUTO_UPDATE --body off
#            自動更新要跑哪條:repo 變數 AUTO_UPDATE_PIPELINE(all / database / news,預設 all)
on:
  schedule:
    # Daily at 13:00 UTC = 21:00 Taipei time (台灣晚上 9 點);只在 AUTO_UPDATE=on 時真的執行
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "要更新哪一部分 / Which pipeline"
        type: choice
        options: [all, database, news]
        default: all
      max_llm_items:
        description: "本次最多送幾則新聞給 AI(空白 = 不限)"
        required: false
        default: "30"

permissions:
  contents: write  # needed to commit data/*.json back

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # 手動觸發一律執行;排程觸發只在自動更新開關打開時執行
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPDATE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIPELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline || vars.AUTO_UPDATE_PIPELINE || 'all' }}
      MAX_LLM_ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_llm_items || '30' }}
      RUN_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--only $PIPELINE"
          if [ -n "$MAX_LLM_ITEMS" ]; then ARGS="$ARGS --max-llm-items $MAX_LLM_ITEMS"; fi
          echo "Running: python backend/run.py $ARGS ($RUN_KIND)"
          python backend/run.py $ARGS

      - name: Commit updated data
        run: |
          git config user.name "trade-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/agreements.json data/events.json data/meta.json
          if git diff --staged --quiet; then
            echo "No data changes; skipping commit"
          else
            COUNT=$(python -c "import json;d=json.load(open('data/meta.json'));print(d.get('event_count_this_run', 0))")
            git commit -m "data: $RUN_KIND refresh [$PIPELINE] ($COUNT events)"
            git push
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: |
            data/meta.json
            data/events.json
          retention-days: 30
