server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed bundles and fonts never change under the same name.
    location /_expo/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /assets/ { try_files $uri =404; expires 30d; }

    # Single-page app: every route is handled by index.html in the browser.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
